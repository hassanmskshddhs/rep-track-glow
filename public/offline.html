<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IronLog — Offline</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1116" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0e1116; color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
      body { display: grid; place-items: center; padding: 1.5rem; text-align: center; }
      .card { max-width: 22rem; }
      .badge { width: 64px; height: 64px; margin: 0 auto 1.25rem; border-radius: 16px; background: #f5bc42; display: grid; place-items: center; font-weight: 800; color: #0e1116; font-size: 1.25rem; box-shadow: 0 10px 40px -10px rgba(245,188,66,0.5); }
      h1 { font-size: 1.25rem; margin: 0 0 0.5rem; letter-spacing: 0.02em; }
      p { color: #a1a1aa; margin: 0 0 1.5rem; font-size: 0.925rem; line-height: 1.5; }
      button { background: #f5bc42; color: #0e1116; border: 0; padding: 0.65rem 1.25rem; border-radius: 0.6rem; font-weight: 700; font-size: 0.925rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">IL</div>
      <h1>You're offline</h1>
      <p>IronLog can't reach the network right now. Reconnect and try again — your saved logs are still here.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
